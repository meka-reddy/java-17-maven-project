# Generated by Hanuman Solutions LLC.
name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches:
      - 'sonar/auto-fix-type-none'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -DskipTests verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=meka-reddy_java-17-maven-project
          -Dsonar.branch.name=sonar/auto-fix-type-none
          -Dsonar.newCode.referenceBranch=main
          -Dsonar.organization=hanuman-solutions
          -Dsonar.host.url=https://sonarcloud.io
